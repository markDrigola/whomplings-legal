<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whomplings — Legal</title>
<style>
  :root { --accent:#b0ff34; --bg:#0e1512; --panel:#16211c; --text:#e7f3ec; --muted:#95a89e; --line:#24352c; }
  html,body { margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .card { max-width:520px; margin:20px; padding:32px; }
  .game { color:var(--accent); font-weight:800; letter-spacing:.5px; text-transform:uppercase; font-size:14px; }
  h1 { font-size:26px; margin:6px 0 20px; }
  a.doc { display:block; padding:16px 18px; margin:12px 0; background:var(--panel); border:1px solid var(--line); border-radius:12px; color:var(--text); text-decoration:none; }
  a.doc:hover { border-color:var(--accent); }
  a.doc b { color:#fff; }
  a.doc span { display:block; color:var(--muted); font-size:14px; margin-top:2px; }
  .foot { color:var(--muted); font-size:13px; margin-top:22px; }
  .foot a { color:#7fd4ff; }
</style>
</head>

  <div class="card">
    <div class="game">Whomplings</div>
